[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lectpy"
version = "0.1.0"
description = "Superior interactive Python lecture platform: executable narrative + trace stepping + static publishing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lectpy contributors" }]
keywords = ["lecture", "education", "tracing", "visualization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
jupyter = ["jupyter_client>=8"]
viz = ["numpy>=1.24"]

[project.scripts]
lecture = "lecture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/lecture/export_static.py" = ["E501"]
"src/lecture/trace.py" = ["E741"]
"tests/test_trace.py" = ["E741"]
